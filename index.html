<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumina - Media Social</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> Lumina</div>
    <div class="top-tabs">
      <span class="active">Para ti</span>
    </div>
  </header>

  <!-- Feed Principal -->
  <main id="feed"></main>

  <!-- Botón Flotante (+) para Subir Multimedia -->
  <div class="upload-wrapper">
    <label for="file-input" class="upload-btn">
      <i class="fa-solid fa-plus"></i>
    </label>
    <!-- Se remueve 'capture' para permitir elegir entre Cámara o Galería -->
    <input type="file" id="file-input" accept="image/*,video/*">
  </div>

  <!-- Modal de Creación / Vista Previa -->
  <div id="preview-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <button id="cancel-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        <h3>Nueva Publicación</h3>
        <button id="publish-btn" class="btn-primary">Publicar</button>
      </div>

      <div class="preview-area" id="preview-container">
        <!-- Se inserta dinámicamente <img> o <video> -->
      </div>

      <!-- Selección de Filtro -->
      <div class="filter-selector">
        <span class="filter-tag active" data-filter="normal">Normal</span>
        <span class="filter-tag" data-filter="vintage">Vintage</span>
        <span class="filter-tag" data-filter="cyber">Cyber</span>
        <span class="filter-tag" data-filter="bw">B&N</span>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-pen"></i>
        <input type="text" id="caption-input" placeholder="Escribe un pie de foto o video..." maxlength="150">
      </div>

      <!-- Selector Opcional de Música -->
      <div class="input-group audio-input-group">
        <i class="fa-solid fa-music"></i>
        <input type="file" id="audio-input" accept="audio/*">
      </div>
    </div>
  </div>

  <!-- Modal / Drawer de Comentarios -->
  <div id="comments-modal" class="modal">
    <div class="modal-card comments-card">
      <div class="modal-header">
        <h3>Comentarios</h3>
        <button id="close-comments-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="comments-list" class="comments-list"></div>
      <div class="comment-input-area">
        <input type="text" id="new-comment-input" placeholder="Añadir comentario...">
        <button id="send-comment-btn" class="btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
