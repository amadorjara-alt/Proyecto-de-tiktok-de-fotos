<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumina - Photo Social</title>

  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SDK Supabase v2 (Cargado en el HEAD para garantizar disponibilidad) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Hoja de Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> Lumina</div>
    <div class="top-tabs">
      <span class="active">Para ti</span>
      <span>Siguiendo</span>
    </div>
    <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
  </header>

  <!-- Feed Principal de Fotos -->
  <main id="feed"></main>

  <!-- Botón Flotante Central (+) para la Cámara -->
  <div class="upload-wrapper">
    <label for="file-input" class="upload-btn">
      <i class="fa-solid fa-plus"></i>
    </label>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </div>

  <!-- Modal / Vista Previa de la Foto -->
  <div id="preview-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <button id="cancel-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        <h3>Nueva Publicación</h3>
        <button id="publish-btn" class="btn-primary">Publicar</button>
      </div>

      <div class="preview-area">
        <img id="preview-img" src="" alt="Vista previa">
      </div>

      <!-- Filtros -->
      <div class="filter-selector">
        <span class="filter-tag active" data-filter="normal">Normal</span>
        <span class="filter-tag" data-filter="vintage">Vintage</span>
        <span class="filter-tag" data-filter="cyber">Cyber</span>
        <span class="filter-tag" data-filter="bw">B&N</span>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-pen"></i>
        <input type="text" id="caption-input" placeholder="Escribe un pie de foto creativo..." maxlength="150">
      </div>
    </div>
  </div>

  <!-- Código JavaScript principal -->
  <script src="script.js"></script>
</body>
</html>
